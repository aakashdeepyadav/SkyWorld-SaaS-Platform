version: "3.9"

services:
  # ── MongoDB ────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-skyworld}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS:-skyworld_secret}
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Redis (session cache & Socket.IO adapter) ──────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Server ─────────────────────────────────────────────────────
  server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://${MONGO_USER:-skyworld}:${MONGO_PASS:-skyworld_secret}@mongo:27017/skyworld?authSource=admin
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    ports:
      - "${PORT:-5000}:5000"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mongo_data:
