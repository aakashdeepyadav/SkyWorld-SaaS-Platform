<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon_96px.png" />
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon_48px.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon_183px.png" />
  <meta name="theme-color" content="#0ea5e9" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkyWorld</title>
</head>

<body>
  <div id="root">
    <!-- Pre-React loader — removed automatically once React mounts -->
    <div id="app-loader" style="
      position:fixed;inset:0;z-index:9999;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      background:#0f172a;
      font-family:'Inter',system-ui,-apple-system,sans-serif;
      transition:opacity .4s ease-out;
    ">
      <!-- Animated logo mark -->
      <div style="position:relative;width:32px;height:32px;margin-bottom:18px;">
        <img src="/icon_logo_coloured.png" alt="" width="32" height="32"
          style="position:relative;z-index:1;animation:_lPulse 2s ease-in-out infinite;" />
        <div style="
          position:absolute;inset:-6px;border-radius:50%;
          background:radial-gradient(circle,rgba(14,165,233,.12) 0%,transparent 70%);
          animation:_lGlow 2s ease-in-out infinite;
        "></div>
      </div>
      <!-- Loading bar -->
      <div style="width:120px;height:1.5px;background:transparent;border-radius:2px;overflow:hidden;margin-top:6px;">
        <div style="
          width:40%;height:100%;border-radius:2px;
          background:linear-gradient(90deg,#0ea5e9,#6366f1);
          animation:_lBar 1.4s ease-in-out infinite;
        "></div>
      </div>
      <p style="
        margin-top:12px;font-size:10px;font-weight:500;letter-spacing:.06em;
        color:rgba(148,163,184,.25);text-transform:uppercase;
      ">Loading</p>
    </div>
    <style>
      @keyframes _lPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.06);opacity:.85}}
      @keyframes _lGlow{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.3);opacity:1}}
      @keyframes _lBar{0%{transform:translateX(-100%)}50%{transform:translateX(150%)}100%{transform:translateX(300%)}}
    </style>
  </div>
  <script type="module" src="/src/main.jsx"></script>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</body>

</html>
